<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>卡皮巴拉的一天</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#F0A15C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);

    --bg: #FBF3E6;
    --surface: #FFFFFF;
    --surface-soft: #FFF9F0;
    --ink: #4A3320;
    --ink-soft: #93795F;
    --line: #EDE0CC;
    --capybara: #B0824F;
    --capybara-dark: #8A6238;
    --capybara-belly: #E9CFA0;

    --morning: #F0A15C;
    --morning-soft: #FCE5C9;
    --noon: #6FAE7C;
    --noon-soft: #DCEEDD;
    --evening: #DE7F63;
    --evening-soft: #F7DCD2;
    --sleep: #6B76B0;
    --sleep-soft: #DFE1F2;

    --shadow: 0 10px 26px -14px rgba(74,51,32,0.32);
  }
  *{box-sizing:border-box;}
  html{ scroll-padding-top: env(safe-area-inset-top, 0px); height:100%;}
  body{
    height:100%;
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans TC", "Baloo 2", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#241A12;
      --surface:#2E2116;
      --surface-soft:#33261A;
      --ink:#F3E6D4;
      --ink-soft:#C2A98A;
      --line:#463420;
      --capybara:#C79A63;
      --capybara-dark:#E4BC85;
      --capybara-belly:#7A5C36;
      --morning-soft:#4A3520;
      --noon-soft:#2C3B2C;
      --evening-soft:#432B26;
      --sleep-soft:#2A2C42;
    }
  }
  :root[data-theme="dark"]{
    --bg:#241A12;
    --surface:#2E2116;
    --surface-soft:#33261A;
    --ink:#F3E6D4;
    --ink-soft:#C2A98A;
    --line:#463420;
    --capybara:#C79A63;
    --capybara-dark:#E4BC85;
    --capybara-belly:#7A5C36;
    --morning-soft:#4A3520;
    --noon-soft:#2C3B2C;
    --evening-soft:#432B26;
    --sleep-soft:#2A2C42;
  }

  h1,h2,h3,.display{ font-family:"Baloo 2","Noto Sans TC",system-ui,sans-serif; }

  .app{
    max-width: 560px;
    margin: 0 auto;
    padding: calc(20px + env(safe-area-inset-top,0px)) 18px calc(28px + env(safe-area-inset-bottom,0px));
    min-height: 100%;
  }

  /* ---------- Hero ---------- */
  .hero{
    position: relative;
    border-radius: 28px;
    padding: 22px 20px 18px;
    background: linear-gradient(180deg, var(--period-soft, var(--morning-soft)) 0%, var(--surface) 78%);
    border: 1px solid var(--line);
    overflow: hidden;
    transition: background 700ms ease;
  }
  .sky{
    position:absolute; inset:0;
    overflow:hidden;
    pointer-events:none;
  }
  .orb{
    position:absolute;
    width:92px; height:92px;
    border-radius:50%;
    left: 50%;
    top: 6px;
    transform: translateX(-50%);
    background: var(--period-color, var(--morning));
    box-shadow: 0 0 0 10px color-mix(in srgb, var(--period-color, var(--morning)) 18%, transparent);
    transition: background 700ms ease, box-shadow 700ms ease, top 700ms ease;
  }
  .stars{
    position:absolute; inset:0;
    opacity:0;
    transition: opacity 700ms ease;
  }
  [data-period="sleep"] .stars{ opacity:1; }
  .stars span{
    position:absolute;
    width:3px; height:3px;
    background: var(--capybara-belly);
    border-radius:50%;
  }

  .hero-inner{ position:relative; z-index:1; text-align:center; }
  .hero-eyebrow{
    font-size:13px;
    color: var(--ink-soft);
    margin: 2px 0 0;
    letter-spacing:.01em;
  }
  .bgm-toggle{
    position:absolute;
    top:14px; right:14px;
    z-index:2;
    width:34px; height:34px;
    border-radius:50%;
    border:1px solid var(--line);
    background: var(--surface);
    color: var(--ink-soft);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .bgm-toggle svg{ width:16px; height:16px; }
  .bgm-toggle.on{ color: var(--period-color); border-color: color-mix(in srgb, var(--period-color) 45%, var(--line)); }
  .hero-time{
    font-family:"Baloo 2";
    font-weight:700;
    font-size:34px;
    margin: 4px 0 12px;
    text-align:center;
    color: var(--ink);
  }

  .capy-wrap{
    position:relative;
    width:150px; margin: 2px auto 0;
    animation: capyFloat 4.4s ease-in-out infinite;
    transform-origin: 50% 92%;
  }
  .capy-glow{
    position:absolute;
    left:50%; top:38%;
    width:150%; height:80%;
    transform: translate(-50%,-50%);
    background: radial-gradient(circle, var(--period-color) 0%, transparent 68%);
    opacity: 0.22;
    filter: blur(6px);
    transition: background 700ms ease;
    z-index:0;
  }
  .capy-img{
    position:relative;
    z-index:1;
    display:block;
    width:100%;
    height:auto;
    filter: drop-shadow(0 10px 14px rgba(74,51,32,0.22));
    cursor:pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .heart-pop{
    position:absolute;
    z-index:2;
    left:50%; top:40%;
    font-size:22px;
    line-height:1;
    pointer-events:none;
    transform: translate(-50%,-50%) scale(0.6);
    opacity:0;
    animation: heartRise 1700ms ease-out forwards;
  }
  @keyframes heartRise{
    0%{ transform: translate(-50%,-50%) scale(0.5) rotate(var(--rot,0deg)); opacity:0; }
    12%{ opacity:1; transform: translate(-50%,-50%) scale(1.1) rotate(var(--rot,0deg)); }
    70%{ opacity:0.9; }
    100%{ transform: translate(calc(-50% + var(--drift,0px)), -260%) scale(0.85) rotate(var(--rot,0deg)); opacity:0; }
  }
  @media (prefers-reduced-motion: reduce){
    .heart-pop{ animation-duration: 1ms; }
  }
  @keyframes capyFloat{
    0%,100%{ transform: translateY(0) rotate(0deg); }
    50%{ transform: translateY(-7px) rotate(-1.2deg); }
  }
  @keyframes capyPop{
    0%{ transform: scale(1); }
    35%{ transform: scale(1.05) translateY(-4px); }
    100%{ transform: scale(1); }
  }
  .capy-wrap.pop{ animation: capyPop 380ms ease; }
  @media (prefers-reduced-motion: reduce){
    .capy-wrap.pop{ animation: none; }
  }

  .hero-line{
    font-size: 15px;
    color: var(--ink);
    margin: 6px auto 0;
    max-width: 320px;
    line-height:1.55;
  }

  /* ---------- Tabs ---------- */
  .tabs{
    display:grid;
    grid-template-columns: repeat(4,1fr);
    gap:8px;
    margin: 18px 0 16px;
  }
  .tab{
    appearance:none;
    border:1px solid var(--line);
    background: var(--surface);
    border-radius:18px;
    padding: 10px 4px 9px;
    display:flex; flex-direction:column; align-items:center; gap:5px;
    cursor:pointer;
    font-family:"Noto Sans TC";
    color: var(--ink-soft);
    transition: background 200ms ease, border-color 200ms ease, color 200ms ease, transform 150ms ease;
  }
  .tab:active{ transform: scale(0.96); }
  .tab svg{ width:22px; height:22px; }
  .tab-label{ font-size:12.5px; font-weight:600; }
  .tab-count{
    font-size:10.5px;
    color: var(--ink-soft);
    background: var(--surface-soft);
    border-radius:8px;
    padding: 0px 6px;
    min-width: 16px;
  }
  .tab.active{
    background: var(--period-soft);
    border-color: color-mix(in srgb, var(--period-color) 45%, var(--line));
    color: var(--ink);
  }
  .tab.active .tab-count{ background: var(--surface); }
  .tab.active svg{ color: var(--period-color); }

  /* ---------- Panel ---------- */
  .panel{
    background: var(--surface);
    border:1px solid var(--line);
    border-radius:24px;
    padding: 18px 16px 16px;
    box-shadow: var(--shadow);
  }
  .panel-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 4px;
  }
  .panel-title{
    font-size:19px; font-weight:700; margin:0;
    display:flex; align-items:center; gap:8px;
  }
  .panel-title svg{ width:20px; height:20px; color: var(--period-color); }
  .panel-desc{
    font-size: 13.5px;
    color: var(--ink-soft);
    margin: 2px 0 16px;
    line-height:1.5;
  }

  .add-row{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:10px;
  }
  .record-btn{
    width:100%;
    border:none;
    border-radius:16px;
    padding: 13px 10px;
    background: var(--period-color);
    color: #fff;
    font-family:"Noto Sans TC";
    font-weight:700;
    font-size: 14.5px;
    display:flex; align-items:center; justify-content:center; gap:7px;
    cursor:pointer;
    transition: filter 150ms ease, transform 150ms ease;
  }
  .record-btn:active{ transform: scale(0.98); filter:brightness(0.95); }
  .record-btn svg{ width:18px; height:18px; flex:0 0 auto; }
  .record-btn.recording{
    background: #C4483F;
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ box-shadow: 0 0 0 0 rgba(196,72,63,0.35); }
    50%{ box-shadow: 0 0 0 9px rgba(196,72,63,0); }
  }
  .rec-timer{
    text-align:center;
    font-family:"Baloo 2";
    font-size:13px;
    color: var(--ink-soft);
    margin-top:8px;
    min-height: 16px;
  }
  .upload-btn{
    width:100%;
    border-radius:16px;
    padding: 13px 10px;
    background: transparent;
    border: 1.5px solid var(--period-color);
    color: var(--period-color);
    font-family:"Noto Sans TC";
    font-weight:700;
    font-size: 14.5px;
    display:flex; align-items:center; justify-content:center; gap:7px;
    cursor:pointer;
    transition: filter 150ms ease, transform 150ms ease;
  }
  .upload-btn:active{ transform: scale(0.98); }
  .upload-btn svg{ width:18px; height:18px; flex:0 0 auto; }

  .folder-import{
    width:100%;
    margin-top:9px;
    border:none;
    background:transparent;
    color: var(--ink-soft);
    font-family:"Noto Sans TC";
    font-size:12.5px;
    font-weight:600;
    display:flex; align-items:center; justify-content:center; gap:6px;
    cursor:pointer;
    padding: 6px;
    text-decoration: underline;
    text-decoration-color: var(--line);
    text-underline-offset: 3px;
  }
  .folder-import svg{ width:14px; height:14px; flex:0 0 auto; }

  .list{
    list-style:none; margin: 16px 0 0; padding:0;
    display:flex; flex-direction:column; gap:8px;
  }
  .item{
    display:flex; align-items:center; gap:10px;
    background: var(--surface-soft);
    border:1px solid var(--line);
    border-radius:14px;
    padding: 9px 10px;
  }
  .item-play{
    width:34px; height:34px; flex:0 0 auto;
    border-radius:50%;
    border:none;
    background: var(--period-soft);
    color: var(--period-color);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .item-play svg{ width:15px; height:15px; }
  .item.playing .item-play{ background: var(--period-color); color:#fff; }
  .item{ transition: opacity 300ms ease, filter 300ms ease; }
  .item.played{ opacity:0.4; filter: grayscale(1); }
  .link-row{
    display:flex; flex-wrap:wrap; gap:6px 8px;
    align-items:center; justify-content:center;
    margin-top:6px;
  }
  .link-btn{
    border:1px solid var(--line);
    background: var(--surface-soft);
    color: var(--ink-soft);
    font-family:"Noto Sans TC";
    font-size:12px; font-weight:600;
    border-radius:999px;
    padding:6px 12px;
    cursor:pointer;
  }
  .link-btn.strong{ background: var(--period-color); border-color:transparent; color:#fff; }
  .link-status{ font-size:12px; font-weight:600; color: var(--ink-soft); }
  .linked-mark{ font-size:13px; opacity:0.6; cursor:default; }
  .item-name{
    flex:1 1 auto;
    min-width:0;
    font-size: 14px;
    font-weight:600;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .item-time{
    font-size: 11.5px;
    color: var(--ink-soft);
    flex: 0 0 auto;
  }
  .item-del{
    flex:0 0 auto;
    width:30px; height:30px;
    border:none; background:transparent;
    color: var(--ink-soft);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%;
  }
  .item-del:active{ background: var(--line); }
  .item-del svg{ width:15px; height:15px; }

  .empty{
    text-align:center;
    padding: 26px 10px 10px;
    color: var(--ink-soft);
    font-size: 13.5px;
    line-height:1.6;
  }

  .play-row{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:10px;
    margin-top: 16px;
  }
  .play-btn{
    border-radius:14px;
    padding: 11px 8px;
    border: 1.5px solid var(--period-color);
    background: transparent;
    color: var(--period-color);
    font-family:"Noto Sans TC";
    font-weight:700;
    font-size: 13.5px;
    display:flex; align-items:center; justify-content:center; gap:6px;
    cursor:pointer;
  }
  .play-btn svg{ width:16px; height:16px; }
  .play-btn:disabled{ opacity:0.4; cursor:not-allowed; }
  .play-btn.active{ background: var(--period-color); color:#fff; }

  /* ---------- Now playing bar ---------- */
  .nowplaying{
    position: sticky;
    bottom: calc(10px + env(safe-area-inset-bottom,0px));
    margin-top: 14px;
    background: var(--ink);
    color: var(--surface);
    border-radius:18px;
    padding: 11px 14px;
    display:none;
    align-items:center; gap:10px;
    box-shadow: 0 14px 30px -12px rgba(0,0,0,0.45);
  }
  .nowplaying.show{ display:flex; }
  .np-icon{ width:30px; height:30px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; }
  .np-icon svg{ width:17px; height:17px; }
  .np-text{ flex:1 1 auto; min-width:0; }
  .np-title{ font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .np-sub{ font-size:11px; opacity:.7; }
  .np-stop{
    flex:0 0 auto; width:32px; height:32px; border-radius:50%;
    border:none; background: rgba(255,255,255,0.12); color:#fff;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .np-stop svg{ width:14px; height:14px; }

  /* ---------- Naming modal ---------- */
  .modal-backdrop{
    position: fixed; inset:0;
    background: rgba(36,26,18,0.45);
    display:none; align-items:flex-end; justify-content:center;
    z-index: 50;
    padding: 0;
  }
  .modal-backdrop.show{ display:flex; }
  .modal{
    width:100%; max-width: 560px;
    background: var(--surface);
    border-radius: 24px 24px 0 0;
    padding: 20px 20px calc(20px + env(safe-area-inset-bottom,0px));
    animation: slideUp 220ms ease;
  }
  @keyframes slideUp{ from{ transform: translateY(16px); opacity:0;} to{ transform:none; opacity:1;} }
  .modal h3{ margin:0 0 4px; font-size:18px; }
  .modal p{ margin:0 0 14px; font-size:13px; color: var(--ink-soft); }
  .modal input{
    width:100%;
    border:1.5px solid var(--line);
    border-radius:12px;
    padding: 11px 12px;
    font-size:15px;
    font-family:"Noto Sans TC";
    color: var(--ink);
    background: var(--surface-soft);
    margin-bottom: 14px;
  }
  .modal input:focus{ outline:none; border-color: var(--period-color); }
  .modal-actions{ display:flex; gap:10px; }
  .modal-actions button{
    flex:1;
    border-radius:12px;
    padding: 11px;
    font-family:"Noto Sans TC";
    font-weight:700;
    font-size:14px;
    border:none;
    cursor:pointer;
  }
  .modal-cancel{ background: var(--surface-soft); color: var(--ink-soft); border:1px solid var(--line) !important; }
  .modal-save{ background: var(--period-color); color:#fff; }

  .toast{
    position:fixed; left:50%; bottom: calc(24px + env(safe-area-inset-bottom,0px));
    transform: translateX(-50%) translateY(10px);
    background: var(--ink); color: var(--surface);
    padding: 10px 16px; border-radius:12px;
    font-size:13px; opacity:0; pointer-events:none;
    transition: opacity 200ms ease, transform 200ms ease;
    z-index: 60;
    max-width: 86%;
    text-align:center;
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }

  .foot{
    text-align:center;
    font-size:11.5px;
    color: var(--ink-soft);
    margin-top: 18px;
    line-height:1.6;
  }
</style>
</head>
<body>
<div class="app" data-period="morning">

  <div class="hero" id="hero">
    <div class="sky">
      <div class="orb" id="orb"></div>
      <div class="stars" id="stars"></div>
    </div>
    <button class="bgm-toggle" id="bgmToggle" aria-label="背景音樂開關">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="bgmIconOn"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="bgmIconOff" style="display:none;"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/><line x1="3" y1="3" x2="21" y2="21"/></svg>
    </button>
    <div class="hero-inner">
      <h1 class="hero-time" id="periodTitle">早晨</h1>

  function findPeriodByHour(h){
    for (var i=0;i<PERIODS.length;i++){
      var r = PERIODS[i].range, lo=r[0], hi=r[1];
      if (hi>24){ if (h>=lo || h< hi-24) return PERIODS[i]; }
      else if (h>=lo && h<hi) return PERIODS[i];
    }
    return PERIODS[0];
  }
  function periodByKey(k){ for (var i=0;i<PERIODS.length;i++) if (PERIODS[i].key===k) return PERIODS[i]; return PERIODS[0]; }

  function tryPlayBgm(){

  }

  setBgmUI(bgmOn);

  document.addEventListener('click', function firstTap(){

  // ---------- IndexedDB ----------
  var DB_NAME = "capybara-routine-db";
  var DB_VERSION = 2;
  var dbPromise = new Promise(function(resolve, reject){
    var req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = function(e){
      var db = e.target.result;
      if (!db.objectStoreNames.contains("recordings")){
        var store = db.createObjectStore("recordings", { keyPath:"id", autoIncrement:true });
        store.createIndex("category", "category", { unique:false });
      }
      if (!db.objectStoreNames.contains("handles")){
        db.createObjectStore("handles");
      }
    };
    req.onsuccess = function(e){ resolve(e.target.result); };
    req.onerror = function(e){ reject(e); };
  });

  function dbAdd(rec){
    return dbPromise.then(function(db){
      return new Promise(function(res, rej){
        var tx = db.transaction("recordings","readwrite");
        var st = tx.objectStore("recordings");
        var r = st.add(rec);
        r.onsuccess = function(){ res(r.result); };
        r.onerror = function(e){ rej(e); };
      });
    });
  }
  function dbGetByCategory(cat){
    return dbPromise.then(function(db){
      return new Promise(function(res, rej){
        var tx = db.transaction("recordings","readonly");
        var idx = tx.objectStore("recordings").index("category");
        var out = [];
        var req = idx.openCursor(IDBKeyRange.only(cat));
        req.onsuccess = function(e){
          var cur = e.target.result;
          if (cur){ out.push(cur.value); cur.continue(); }
          else { out.sort(function(a,b){ return a.createdAt - b.createdAt; }); res(out); }
        };
        req.onerror = function(e){ rej(e); };
      });
    });
  }
  function dbDelete(id){
    return dbPromise.then(function(db){
      return new Promise(function(res, rej){
        var tx = db.transaction("recordings","readwrite");
        var r = tx.objectStore("recordings").delete(id);
        r.onsuccess = function(){ res(); };
        r.onerror = function(e){ rej(e); };
      });
    });
  }

  var PLAYED_KEY = 'capy_played_v1';
  var playedIds = {};
  function todayStr(){ var d = new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
  try{
    var rawPlayed = localStorage.getItem(PLAYED_KEY);
    if (rawPlayed){
      var po = JSON.parse(rawPlayed);
      if (po && po.date === todayStr()) playedIds = po.ids || {};
    }
  }catch(e){}
  function savePlayed(){
    try{ localStorage.setItem(PLAYED_KEY, JSON.stringify({ date: todayStr(), ids: playedIds })); }catch(e){}
  }
  function markPlayed(id){ playedIds[id] = true; savePlayed(); }
  function clearPlayedFor(list){
    list.forEach(function(r){ delete playedIds[r.id]; });
    savePlayed();
  }

  // ---------- Audio playback (one track per press) ----------
  var currentAudio = null;
  var currentUrl = null;
  var playMode = null; // 'random' | 'ordered' | 'single'
  var currentPlayingId = null;

  var nowplayingEl = document.getElementById('nowplaying');
  var npTitle = document.getElementById('npTitle');
  var npSub = document.getElementById('npSub');
  document.getElementById('npStop').addEventListener('click', function(){ stopPlayback(); });

  function stopPlayback(){
    if (currentAudio){
      currentAudio.onended = null;
      currentAudio.pause();
      currentAudio.src = '';
      currentAudio = null;
    }
    if (currentUrl){ URL.revokeObjectURL(currentUrl); currentUrl = null; }
    playMode = null;
    currentPlayingId = null;
    nowplayingEl.classList.remove('show');
    document.getElementById('btnRandom').classList.remove('active');
    document.getElementById('btnOrdered').classList.remove('active');
    renderList(currentList);
  }

  function playRecord(rec, mode){
    stopPlayback();
    playMode = mode;
    currentPlayingId = rec.id;
    markPlayed(rec.id);
    var src;
    if (rec.url){ src = rec.url; }
    else { currentUrl = URL.createObjectURL(rec.blob); src = currentUrl; }
    var audio = new Audio(src);
    currentAudio = audio;
    npTitle.textContent = rec.surprise ? ('🎁 ' + rec.name) : rec.name;
    npSub.textContent = rec.surprise ? '驚喜！' : (mode === 'random' ? '隨機播放' : (mode === 'ordered' ? '依序播放' : '播放中'));
    nowplayingEl.classList.add('show');
    if (mode === 'random') document.getElementById('btnRandom').classList.add('active');
    if (mode === 'ordered') document.getElementById('btnOrdered').classList.add('active');
    renderList(currentList);
    audio.onended = function(){ stopPlayback(); };   // play ONE, then stop
    audio.play().catch(function(){
      toast('無法播放，請再試一次');
      stopPlayback();
    });
  }

  // pick the next not-yet-played track (random or in order)
  function pickNext(list, mode){
    var pool = list.filter(function(r){ return !playedIds[r.id]; });
    if (!pool.length){
      clearPlayedFor(list);
      pool = list.slice();
      toast('這個時段都聽完囉，從頭開始 ↻');
    }
    return mode === 'random' ? pool[Math.floor(Math.random()*pool.length)] : pool[0];
  }

  // ---------- Audio folders hosted on the website (GitHub Pages) ----------
  // Put audio into folders named morning / noon / evening / sleep (or 早上 / 中午 /
  // 晚上 / 睡覺) anywhere in the repo, plus a hidden "surprise" (or 驚喜) folder.
  // The app lists the repo once through GitHub's public API, so new files just appear.
  var SURPRISE_RATE = 0.2;     // chance a random/ordered press plays a surprise instead
  var surprisePool = [];
  var hostedByCat = { morning:[], noon:[], evening:[], sleep:[] };
  var HOSTED_CACHE_KEY = 'capy_hosted_v2';
  var FOLDER_ALIASES = {
    morning:['morning','早上','早晨'],
    noon:['noon','中午'],
    evening:['evening','晚上'],
    sleep:['sleep','睡覺','睡前'],
    surprise:['surprise','驚喜']
  };
  function folderToCat(name){
    var n = name.toLowerCase();
    for (var k in FOLDER_ALIASES){ if (FOLDER_ALIASES[k].indexOf(n) !== -1) return k; }
    return null;
  }
  var siteRoot = null;   // e.g. https://user.github.io/repo/

  function applyHosted(files){
    var byCat = { morning:[], noon:[], evening:[], sleep:[] }, sp = [];
    files.forEach(function(f){
      var name = f.path.split('/').pop();
      var rec = { id:'web:'+f.path, category:f.cat, name:stripExt(name), hosted:true, linked:true,
                  createdAt:0, url: siteRoot + f.path.split('/').map(encodeURIComponent).join('/') };
      if (f.cat === 'surprise'){ rec.surprise = true; rec.id = 'sp:'+f.path; sp.push(rec); }
      else byCat[f.cat].push(rec);
    });
    function byName(a,b){ return a.name.localeCompare(b.name, undefined, { numeric:true }); }
    Object.keys(byCat).forEach(function(k){ byCat[k].sort(byName); });
    sp.sort(byName);
    hostedByCat = byCat;
    surprisePool = sp;
  }

  function loadHosted(){
    if (!/^https?:$/.test(location.protocol)) return Promise.resolve();
    var m = location.hostname.match(/^([^.]+)\.github\.io$/);
    var segs = location.pathname.split('/').filter(Boolean);
    if (segs.length && segs[segs.length-1].indexOf('.') !== -1) segs.pop();
    var repo = segs[0];
    if (!m || !repo) return Promise.resolve();
    siteRoot = location.origin + '/' + repo + '/';
    try{
      var cached = JSON.parse(localStorage.getItem(HOSTED_CACHE_KEY) || 'null');
      if (cached && cached.length) applyHosted(cached);
    }catch(e){}
    function fetchTree(ref){
      return fetch('https://api.github.com/repos/'+m[1]+'/'+repo+'/git/trees/'+ref+'?recursive=1')
        .then(function(r){ if (!r.ok) throw new Error('GitHub API '+r.status); return r.json(); });
    }
    return fetchTree('main').catch(function(){ return fetchTree('HEAD'); }).then(function(data){
      var files = [];
      (data.tree || []).forEach(function(t){
        if (t.type !== 'blob') return;
        var parts = t.path.split('/');
        if (parts.length < 2 || !isAudioName(parts[parts.length-1])) return;
        var cat = folderToCat(parts[parts.length-2]);
        if (cat) files.push({ cat:cat, path:t.path });
      });
      try{ localStorage.setItem(HOSTED_CACHE_KEY, JSON.stringify(files)); }catch(e){}
      applyHosted(files);
    }).catch(function(e){ console.error('hosted folder load failed', e); });
  }

  function pickSurprise(){
    var pool = surprisePool.filter(function(r){ return !playedIds[r.id]; });
    if (!pool.length){
      surprisePool.forEach(function(r){ delete playedIds[r.id]; });
      savePlayed();
      pool = surprisePool.slice();
    }
    return pool[Math.floor(Math.random()*pool.length)];
  }

  function startPlay(list, mode, startId){
    if (!list.length){ toast('這個時段還沒有音檔喔'); return; }
    var rec = null;
    if (mode === 'single'){
      rec = list.filter(function(r){ return r.id === startId; })[0];
    } else if (surprisePool.length && Math.random() < SURPRISE_RATE){
      rec = pickSurprise();
    } else {
      rec = pickNext(list, mode);
    }
    if (rec) playRecord(rec, mode);
  }

  // ---------- List rendering ----------
  var listEl = document.getElementById('list');
  var emptyEl = document.getElementById('emptyState');
  var currentList = [];

  function fmtTime(ts){
    var d = new Date(ts);
    var mo = d.getMonth()+1, day = d.getDate();
    var hh = String(d.getHours()).padStart(2,'0'), mm = String(d.getMinutes()).padStart(2,'0');
    return mo+'/'+day+' '+hh+':'+mm;
  }

  function renderList(list){
    listEl.innerHTML = '';
    if (!list.length){
      emptyEl.style.display = 'block';
      document.getElementById('btnRandom').disabled = true;
      document.getElementById('btnOrdered').disabled = true;
      return;
    }
    emptyEl.style.display = 'none';
    document.getElementById('btnRandom').disabled = false;
    document.getElementById('btnOrdered').disabled = false;

    list.forEach(function(rec){
      var isPlaying = currentPlayingId === rec.id;
      var li = document.createElement('li');
      li.className = 'item' + (isPlaying ? ' playing' : (playedIds[rec.id] ? ' played' : ''));
      var playSvg = isPlaying
        ? '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
      var tail = rec.linked
        ? '<span class="item-del linked-mark" title="來自資料夾">📁</span>'
        : '<button class="item-del" aria-label="刪除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg></button>';
      li.innerHTML =
        '<button class="item-play" aria-label="播放">'+playSvg+'</button>'+
        '<span class="item-name"></span>'+
        '<span class="item-time">'+(rec.hosted ? '' : fmtTime(rec.createdAt))+'</span>'+
        tail;
      li.querySelector('.item-name').textContent = rec.name;

      li.querySelector('.item-play').addEventListener('click', function(){
        if (currentPlayingId === rec.id){ stopPlayback(); }
        else { startPlay(currentList, 'single', rec.id); }
      });
      var delBtn = li.querySelector('button.item-del');
      if (delBtn){
        delBtn.addEventListener('click', function(){
          if (currentPlayingId === rec.id) stopPlayback();
          dbDelete(rec.id).then(function(){
            toast('已刪除「'+rec.name+'」');
            loadList(current);
            refreshCounts();
          });
        });
      }
      listEl.appendChild(li);
    });
  }

  // ---------- Linked folders (File System Access API: desktop Chrome / Edge) ----------
  var FS_SUPPORTED = (typeof window.showDirectoryPicker === 'function');
  var linkInfo = {};   // category -> { name, needPerm }
  var linkRowEl = document.getElementById('linkRow');

  function isAudioName(n){ return /\.(mp3|m4a|wav|aac|ogg|oga|opus|webm|flac|aiff|amr)$/i.test(n); }

  async function scanLinked(cat, askPermission){
    var h = await dbGetHandle(cat);
    if (!h){ delete linkInfo[cat]; return []; }
    linkInfo[cat] = { name: h.name, needPerm: false };
    try{
      var perm = await h.queryPermission({ mode:'read' });
      if (perm !== 'granted' && askPermission){
        perm = await h.requestPermission({ mode:'read' });
      }
      if (perm !== 'granted'){ linkInfo[cat].needPerm = true; return []; }
      var out = [];
      for await (var entry of h.values()){
        if (entry.kind === 'file' && isAudioName(entry.name)){
          var f = await entry.getFile();
          out.push({ id:'fs:'+cat+':'+entry.name+':'+f.size, category:cat, name:stripExt(entry.name),
                     blob:f, createdAt:f.lastModified, linked:true });
        }
      }
      out.sort(function(a,b){ return a.name.localeCompare(b.name, undefined, { numeric:true }); });
      return out;
    }catch(e){
      console.error('scan failed', e);
      linkInfo[cat].needPerm = true;
      return [];
    }
  }

  function getMerged(cat, askPermission){
    var linked = FS_SUPPORTED ? scanLinked(cat, askPermission).catch(function(){ return []; }) : Promise.resolve([]);
    return Promise.all([dbGetByCategory(cat), linked]).then(function(r){
      return (hostedByCat[cat] || []).concat(r[1], r[0]);
    });
  }

  function mkEl(tag, cls, text, act){
    var el = document.createElement(tag);
    if (cls) el.className = cls;
    el.textContent = text;
    if (act) el.setAttribute('data-act', act);
    return el;
  }
  function renderLinkRow(){
    if (!FS_SUPPORTED){ linkRowEl.style.display = 'none'; return; }
    linkRowEl.style.display = 'flex';
    linkRowEl.innerHTML = '';
    var info = linkInfo[current];
    if (!info){
      linkRowEl.appendChild(mkEl('button','link-btn','📁 連結電腦資料夾（丟檔案進去就自動讀取）','link'));
    } else if (info.needPerm){
      linkRowEl.appendChild(mkEl('button','link-btn strong','允許讀取「'+info.name+'」','grant'));
      linkRowEl.appendChild(mkEl('button','link-btn','解除連結','unlink'));
    } else {
      linkRowEl.appendChild(mkEl('span','link-status','📁 已連結「'+info.name+'」'));
      linkRowEl.appendChild(mkEl('button','link-btn','重新掃描','rescan'));
      linkRowEl.appendChild(mkEl('button','link-btn','解除連結','unlink'));
    }
  }

  async function linkFolder(){
    try{
      var h = await window.showDirectoryPicker({ id:'capy-'+current, mode:'read' });
      await dbPutHandle(current, h);
      toast('已連結「'+h.name+'」');
      await loadList(current, true);
      refreshCounts();
    }catch(e){
      if (e && e.name === 'AbortError') return;
      console.error(e);
      toast('這裡無法連結資料夾，請用電腦版 Chrome / Edge 開啟下載的 index.html');
    }
  }

  linkRowEl.addEventListener('click', function(e){
    var btn = e.target.closest('button[data-act]');
    if (!btn) return;
    var act = btn.getAttribute('data-act');
    if (act === 'link') linkFolder();
    else if (act === 'grant' || act === 'rescan') loadList(current, true);
    else if (act === 'unlink'){
      dbDelHandle(current).then(function(){
        delete linkInfo[current];
        loadList(current);
        refreshCounts();
      });
    }
  });

  // new files dropped into a linked folder show up when you come back to the page
  var lastRescan = 0;
  function rescanIfLinked(){
    if (!FS_SUPPORTED || document.visibilityState !== 'visible') return;
    var info = linkInfo[current];
    if (!info || info.needPerm || currentAudio) return;
    var now = Date.now();
    if (now - lastRescan < 1500) return;
    lastRescan = now;
    loadList(current, false);
    refreshCounts();
  }
  window.addEventListener('focus', rescanIfLinked);
  document.addEventListener('visibilitychange', rescanIfLinked);

  function loadList(key, askPermission){
    return getMerged(key, askPermission).then(function(list){
      if (key !== current) return;
      currentList = list;
      renderList(list);
      renderLinkRow();
    });
  }

  function refreshCounts(){
    PERIODS.forEach(function(p){
      getMerged(p.key, false).then(function(list){
        document.getElementById('count-'+p.key).textContent = list.length;
      });
    });
  }

  // ---------- Tap the capybara for hearts ----------
  var HEART_EMOJI = ['❤️','💛','🧡','💕','💗'];
  function popHearts(container){
    var count = 3 + Math.floor(Math.random()*2); // 3-4 hearts
    for (var i=0;i<count;i++){
      (function(i){
        var span = document.createElement('span');
        span.className = 'heart-pop';
        span.textContent = HEART_EMOJI[Math.floor(Math.random()*HEART_EMOJI.length)];
        var rot = (Math.random()*36-18).toFixed(1);
        var drift = (Math.random()*140-70).toFixed(0);
        span.style.setProperty('--rot', rot+'deg');
        span.style.setProperty('--drift', drift+'px');
        span.style.left = (32 + Math.random()*36) + '%';
        span.style.animationDelay = (i*110) + 'ms';
        container.appendChild(span);
        setTimeout(function(){ span.remove(); }, 1800 + i*110);
      })(i);
    }
  }
  var capyImgEl = document.querySelector('.capy-img');
  var capyWrapForHearts = document.querySelector('.capy-wrap');
  if (capyImgEl && capyWrapForHearts){
    capyImgEl.addEventListener('click', function(){
      popHearts(capyWrapForHearts);
    });
  }

  function selectPeriod(key){
    current = key;
    Object.keys(tabButtons).forEach(function(k){
      tabButtons[k].classList.toggle('active', k===key);
    });
    applyPeriodTheme(periodByKey(key));
    loadList(key);
    var capyWrapEl = document.querySelector('.capy-wrap');
    if (capyWrapEl){
      capyWrapEl.classList.remove('pop');
      void capyWrapEl.offsetWidth; // restart animation
      capyWrapEl.classList.add('pop');
      setTimeout(function(){ capyWrapEl.classList.remove('pop'); }, 400);
    }
  }

  document.getElementById('btnRandom').addEventListener('click', function(){ startPlay(currentList,'random'); });
  document.getElementById('btnOrdered').addEventListener('click', function(){ startPlay(currentList,'ordered'); });

  // ---------- Recording ----------
  var mediaRecorder = null;
  var chunks = [];
  var recStartTime = 0;
  var recTimerInterval = null;
  var pendingBlob = null;

  var recordBtn = document.getElementById('recordBtn');
  var recordLabel = document.getElementById('recordLabel');
  var recordIcon = document.getElementById('recordIcon');
  var recTimerEl = document.getElementById('recTimer');

  function fmtDuration(sec){
    var m = Math.floor(sec/60), s = sec%60;
    return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  }

  recordBtn.addEventListener('click', function(){
    if (mediaRecorder && mediaRecorder.state === 'recording'){
      mediaRecorder.stop();
      return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      toast('這個瀏覽器不支援錄音功能');
      return;
    }
    navigator.mediaDevices.getUserMedia({ audio:true }).then(function(stream){
      chunks = [];
      var mimeType = '';
      var candidates = ['audio/webm','audio/mp4','audio/ogg'];
      for (var i=0;i<candidates.length;i++){
        if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(candidates[i])){ mimeType = candidates[i]; break; }
      }
      try{
        mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType: mimeType }) : new MediaRecorder(stream);
      }catch(e){
        mediaRecorder = new MediaRecorder(stream);
      }
      mediaRecorder.ondataavailable = function(e){ if (e.data && e.data.size>0) chunks.push(e.data); };
      mediaRecorder.onstop = function(){
        stream.getTracks().forEach(function(t){ t.stop(); });
        clearInterval(recTimerInterval);
        recTimerEl.textContent = '';
        recordBtn.classList.remove('recording');
        recordLabel.textContent = '錄新的一段';
        recordIcon.innerHTML = '<circle cx="12" cy="12" r="7" fill="currentColor"/>';
        var blobType = mimeType || 'audio/webm';
        var blob = new Blob(chunks, { type: blobType });
        if (blob.size < 400){ toast('錄音太短了，再試一次吧'); return; }
        pendingBlob = blob;
        pendingUploadName = null;
        openNameModal();
      };
      mediaRecorder.start();
      recStartTime = Date.now();
      recordBtn.classList.add('recording');
      recordLabel.textContent = '停止錄音';
      recordIcon.innerHTML = '<rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/>';
      recTimerInterval = setInterval(function(){
        var sec = Math.floor((Date.now()-recStartTime)/1000);
        recTimerEl.textContent = fmtDuration(sec);
      }, 200);
    }).catch(function(err){
      toast('無法使用麥克風，請確認已允許權限（file:// 本機檔案無法跳出權限視窗，請改用 https 連結）');
    });
  });

  // ---------- Upload existing audio files ----------
  var uploadBtn = document.getElementById('uploadBtn');
  var fileInput = document.getElementById('fileInput');
  var pendingUploadName = null;

  uploadBtn.addEventListener('click', function(){
    fileInput.click();
  });

  fileInput.addEventListener('change', function(){
    var files = Array.prototype.slice.call(fileInput.files || []);
    fileInput.value = '';
    if (!files.length) return;

    var audioFiles = files.filter(function(f){
      return f.type.indexOf('audio') === 0 || /\.(mp3|m4a|wav|aac|ogg|webm|flac|aiff|caf|amr)$/i.test(f.name);
    });
    if (!audioFiles.length){ toast('請選擇音檔格式的檔案'); return; }

    if (audioFiles.length === 1){
      var f = audioFiles[0];
      pendingBlob = f;
      pendingUploadName = stripExt(f.name);
      openNameModal();
      return;
    }

    // multiple files: save all directly using their filenames
    var savePromises = audioFiles.map(function(f){
      return dbAdd({ category: current, name: stripExt(f.name), blob: f, createdAt: Date.now() });
    });
    Promise.all(savePromises).then(function(){
      toast('已加入 '+audioFiles.length+' 個音檔');
      loadList(current);
      refreshCounts();
    }).catch(function(){
      toast('有些檔案加入失敗了，請再試一次');
    });
  });

  function stripExt(filename){
    var i = filename.lastIndexOf('.');
    return i > 0 ? filename.slice(0,i) : filename;
  }

  // ---------- Import a whole folder (bulk, with duplicate skip) ----------
  var folderInput = document.getElementById('folderInput');
  var folderImportBtn = document.getElementById('folderImportBtn');

  folderImportBtn.addEventListener('click', function(){
    folderInput.click();
  });

  folderInput.addEventListener('change', function(){
    var files = Array.prototype.slice.call(folderInput.files || []);
    folderInput.value = '';
    if (!files.length) return;

    var audioFiles = files.filter(function(f){
      return f.type.indexOf('audio') === 0 || /\.(mp3|m4a|wav|aac|ogg|webm|flac|aiff|caf|amr)$/i.test(f.name);
    });
    if (!audioFiles.length){ toast('這個資料夾裡沒有找到音檔'); return; }

    var existing = currentList.slice();
    var added = 0, skipped = 0;
    var jobs = [];

    audioFiles.forEach(function(f){
      var isDup = existing.some(function(rec){ return rec.name === stripExt(f.name) && rec.blob.size === f.size; });
      if (isDup){ skipped++; return; }
      added++;
      jobs.push(dbAdd({ category: current, name: stripExt(f.name), blob: f, createdAt: Date.now() }));
    });

    Promise.all(jobs).then(function(){
      var msg = '已匯入 '+added+' 個新音檔';
      if (skipped) msg += '，略過 '+skipped+' 個重複的';
      toast(msg);
      loadList(current);
      refreshCounts();
    }).catch(function(){
      toast('匯入時發生錯誤，請再試一次');
    });
  });

  // ---------- Naming modal ----------
  var modalBackdrop = document.getElementById('modalBackdrop');
  var nameInput = document.getElementById('nameInput');

  function defaultName(){
    var p = periodByKey(current);
    var n = (currentList.length || 0) + 1;
    return p.label + '音檔 ' + n;
  }

  function openNameModal(){
    nameInput.value = pendingUploadName || defaultName();
    modalBackdrop.classList.add('show');
    setTimeout(function(){ nameInput.focus(); nameInput.select(); }, 50);
  }
  function closeNameModal(){
    modalBackdrop.classList.remove('show');
    pendingBlob = null;
    pendingUploadName = null;
  }
  document.getElementById('modalCancel').addEventListener('click', closeNameModal);
  document.getElementById('modalBackdrop').addEventListener('click', function(e){
    if (e.target === modalBackdrop) closeNameModal();
  });
  document.getElementById('modalSave').addEventListener('click', saveRecording);
  nameInput.addEventListener('keydown', function(e){ if (e.key==='Enter') saveRecording(); });

  function saveRecording(){
    if (!pendingBlob) return;
    var name = nameInput.value.trim() || defaultName();
    var rec = { category: current, name: name, blob: pendingBlob, createdAt: Date.now() };
    dbAdd(rec).then(function(){
      toast('已儲存「'+name+'」');
      closeNameModal();
      pendingBlob = null;
      pendingUploadName = null;
      loadList(current);
      refreshCounts();
    }).catch(function(){
      toast('儲存失敗，請再試一次');
    });
  }

  // ---------- Seed default sample sounds (first run only) ----------
  function base64ToBlob(base64, mime){
    var byteChars = atob(base64);
    var byteNumbers = new Array(byteChars.length);
    for (var i=0;i<byteChars.length;i++){ byteNumbers[i] = byteChars.charCodeAt(i); }
    var byteArray = new Uint8Array(byteNumbers);
    return new Blob([byteArray], { type: mime });
  }
  var DEFAULT_NAMES = { morning:"🔔 預設鈴聲・早晨（可刪除或替換）", noon:"🔔 預設鈴聲・中午（可刪除或替換）", evening:"🔔 預設鈴聲・晚上（可刪除或替換）", sleep:"🔔 預設鈴聲・睡覺（可刪除或替換）" };
  function seedDefaultsIfNeeded(){
    var already = false;
    try{ already = !!localStorage.getItem('capy_seeded_v1'); }catch(e){}
    if (already) return Promise.resolve();
    var jobs = PERIODS.map(function(p, i){
      var b64 = DEFAULT_AUDIO[p.key];
      if (!b64) return Promise.resolve();
      var blob = base64ToBlob(b64, 'audio/mpeg');
      return dbAdd({ category: p.key, name: DEFAULT_NAMES[p.key], blob: blob, createdAt: Date.now() + i });
    });
    return Promise.all(jobs).then(function(){
      try{ localStorage.setItem('capy_seeded_v1', '1'); }catch(e){}
    });
  }

  // ---------- Init ----------
  function boot(){
    selectPeriod(current);
    refreshCounts();
    loadHosted().then(function(){
      loadList(current);
      refreshCounts();
    });
  }
  seedDefaultsIfNeeded().then(boot).catch(function(err){
    console.error('seed failed', err);
    boot();
  });
})();
</script>
